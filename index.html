<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="title">Учет расходов</h1>
        <input
            class="js-expense-input input expense-input"
            placeholder="руб"
            min="0"
            type="number">
        
        <button class="js-expense-btn expense-btn">Добавить</button>

        <select class="js-group-input input group-input">
            <option hidden disabled selected value="Категория">Категория</option>
            <option value="Продукты">Продукты</option>
            <option value="Кафе">Кафе и рестораны</option>
            <option value="Услуги ЖКХ">Услуги ЖКХ</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Аптека">Аптека</option>
        </select>

        <div class="status_element">
            <div class="user_value">
                <p class="user_value-text">
                    <span class="label">Лимит:</span> 
                    <span class="js-limit"></span> руб.</p>
                <p class="user_value-text">
                    <span class="label">Всего:</span> 
                    <span class="js-total"></span> руб.</p>
                <p class="user_value-text user_value-text-status">
                    <span class="label">Статус:</span> 
                    <span class="js-status status"></span></p>
            </div>
            <div class="history">
                <h2 class="history-title">История:</h2>
                <div class="js-history-list history-list"></div>
            </div>
        </div>

        <button class="js-clearButton clearButton">Сбросить расходы</button>
    </div>
   

    <script src="script.js"></script>
</body>
</html>
