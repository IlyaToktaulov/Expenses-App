<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Expenses Tracker</h1>

    <input
        class="js-expense-input expense-input" 
        type="number">
        
    <button class="js-expense-btn expense-btn">Добавить</button>

    <p>Лимит: <span class="js-limit"></span> руб.</p>
    <p>Сумма: <span class="js-total">0</span> руб.</p>
    <p>Статус: <span class="js-status status">Всё хорошо</span></p>

    <h2>История трат</h2>
    <div class="js-history-list history-list"></div>

    <script src="script.js"></script>
</body>
</html>
